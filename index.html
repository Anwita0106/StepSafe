<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Rescue Route Planner</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>🚨 Emergency Rescue Route Planner</h1>
        <p class="subtitle">Advanced pathfinding using Graph, Queue, Stack, Priority Queue, Tree & Hash Map</p>
        
        <div class="main-grid">
            <div class="panel controls">
                <h2>Control Panel</h2>
                
                <div class="control-group">
                    <label>Algorithm</label>
                    <select id="algorithm">
                        <option value="bfs">BFS (Queue - Shortest Path)</option>
                        <option value="dfs">DFS (Stack - Exploration)</option>
                        <option value="dijkstra">Dijkstra (Priority Queue)</option>
                    </select>
                </div>
                
                <div class="control-group">
                    <label>Start Location</label>
                    <select id="startNode"></select>
                </div>
                
                <div class="control-group">
                    <label>Target Victim</label>
                    <select id="endNode"></select>
                </div>
                
                <button onclick="findPath()" class="btn-success">🔍 Find Rescue Route</button>
                <button onclick="generateMap()" class="btn-danger">🔄 Generate New Map</button>
                <button onclick="showAddVictimForm()" class="btn-warning">➕ Add Victim</button>
                
                <div id="victimForm" style="display: none; margin-top: 15px; padding: 15px; background: rgba(0,0,0,0.3); border-radius: 10px;">
                    <h3 style="margin-bottom: 10px; font-size: 1em;">Add New Victim</h3>
                    <div class="control-group">
                        <label>Cell Location</label>
                        <select id="victimCell"></select>
                    </div>
                    <div class="control-group">
                        <label>Priority Level</label>
                        <select id="victimPriority">
                            <option value="high">🔴 High Priority</option>
                            <option value="medium">🟡 Medium Priority</option>
                            <option value="low">🟢 Low Priority</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label>Victim Name</label>
                        <input type="text" id="victimName" placeholder="e.g. John Doe" style="padding: 12px; border: none; border-radius: 8px; background: rgba(255,255,255,0.9); color: #333; width: 100%; font-size: 1em;">
                    </div>
                    <button onclick="submitVictim()" class="btn-success" style="width: 100%; margin-top: 10px;">✅ Add Victim</button>
                    <button onclick="hideAddVictimForm()" class="btn-danger" style="width: 100%; margin-top: 5px;">❌ Cancel</button>
                </div>
                
                <div class="victim-list" id="victimList"></div>
            </div>
            
            <div class="panel">
                <h2>City Map (Graph Structure)</h2>
                <div id="map"></div>
                <div class="legend">
                    <div class="legend-item">
                        <div class="legend-color safe"></div>
                        <span>Safe Zone</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color blocked"></div>
                        <span>Blocked</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color caution"></div>
                        <span>Caution</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color start"></div>
                        <span>Start</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color end"></div>
                        <span>Victim</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color path"></div>
                        <span>Route</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="info-grid">
            <div class="info-card victims">
                <h3>Total Victims</h3>
                <div class="value" id="victimCount">0</div>
            </div>
            <div class="info-card path">
                <h3>Path Length</h3>
                <div class="value" id="pathLength">-</div>
            </div>
            <div class="info-card status">
                <h3>Status</h3>
                <div class="value" style="font-size: 1.3em;" id="status">Ready</div>
            </div>
        </div>
        
        <div class="panel">
            <h2>System Logs</h2>
            <div class="logs" id="logs"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
